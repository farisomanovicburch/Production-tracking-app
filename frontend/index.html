<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Production Tracker</title>
        <link href="assets/lib/fontawesome/css/all.min.css" rel="stylesheet" />
        <link href="assets/lib/sb-admin/styles.css" rel="stylesheet" />
        <link href="assets/lib/spapp/spapp.css" rel="stylesheet" />
        <link href="css/app.css" rel="stylesheet" />
    </head>
    <body class="sb-nav-fixed">
        <nav class="sb-topnav navbar navbar-expand navbar-dark pt-topnav">
            <button type="button" class="btn btn-link btn-sm ms-2" id="sidebarToggle" aria-label="Toggle navigation">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a class="navbar-brand ps-2" href="#dashboard">
                <i class="fa-solid fa-industry me-2"></i><span class="d-none d-sm-inline">Production Tracker</span>
            </a>
            <ul class="navbar-nav align-items-center ms-auto me-3 me-lg-4">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="userMenu" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fa-solid fa-user fa-fw"></i><span class="visually-hidden">User menu</span><span class="d-none d-md-inline ms-1">Demo Admin</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                        <li class="d-md-none"><h6 class="dropdown-header">Demo Admin</h6></li>
                        <li><a class="dropdown-item" href="#profile"><i class="fa-solid fa-id-badge fa-fw me-2"></i>Profile</a></li>
                        <li><hr class="dropdown-divider" /></li>
                        <li><a class="dropdown-item" href="#login"><i class="fa-solid fa-right-from-bracket fa-fw me-2"></i>Logout</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                <nav class="sb-sidenav accordion pt-sidenav" id="sidenavAccordion" aria-label="Main navigation">
                    <div class="sb-sidenav-menu">
                        <div class="nav">
                            <div class="sb-sidenav-menu-heading">Overview</div>
                            <a class="nav-link active" href="#dashboard" aria-current="page">
                                <div class="sb-nav-link-icon"><i class="fa-solid fa-gauge-high fa-fw"></i></div>
                                Dashboard
                            </a>

                            <div class="sb-sidenav-menu-heading">Production</div>
                            <a class="nav-link" href="#runs">
                                <div class="sb-nav-link-icon"><i class="fa-solid fa-list-check fa-fw"></i></div>
                                Runs
                            </a>
                            <a class="nav-link" href="#conversions">
                                <div class="sb-nav-link-icon"><i class="fa-solid fa-scissors fa-fw"></i></div>
                                Conversions
                            </a>

                            <div class="sb-sidenav-menu-heading">Maintenance</div>
                            <a class="nav-link" href="#maintenance">
                                <div class="sb-nav-link-icon"><i class="fa-solid fa-screwdriver-wrench fa-fw"></i></div>
                                Maintenance log
                            </a>

                            <div class="admin-only">
                                <div class="sb-sidenav-menu-heading">Master data <span class="badge rounded-pill text-bg-primary ms-1">Admin</span></div>
                                <a class="nav-link" href="#machines">
                                    <div class="sb-nav-link-icon"><i class="fa-solid fa-gears fa-fw"></i></div>
                                    Machines
                                </a>
                                <a class="nav-link" href="#products">
                                    <div class="sb-nav-link-icon"><i class="fa-solid fa-box fa-fw"></i></div>
                                    Products
                                </a>
                                <a class="nav-link" href="#materials">
                                    <div class="sb-nav-link-icon"><i class="fa-solid fa-boxes-stacked fa-fw"></i></div>
                                    Materials
                                </a>
                                <a class="nav-link" href="#recipes">
                                    <div class="sb-nav-link-icon"><i class="fa-solid fa-flask fa-fw"></i></div>
                                    Recipes
                                </a>
                            </div>

                            <div class="admin-only">
                                <div class="sb-sidenav-menu-heading">Administration <span class="badge rounded-pill text-bg-primary ms-1">Admin</span></div>
                                <a class="nav-link" href="#users">
                                    <div class="sb-nav-link-icon"><i class="fa-solid fa-users fa-fw"></i></div>
                                    Users
                                </a>
                            </div>
                        </div>
                    </div>
                </nav>
            </div>
            <div id="layoutSidenav_content">
                <!-- One section per page: the id is the route (#runs), data-load is the file in views/.
                     The dashboard is last because spapp treats the last section as the default page
                     whenever no defaultView is configured. -->
                <main id="spapp">
                    <section id="login" data-load="login.html"></section>
                    <section id="register" data-load="register.html"></section>
                    <section id="runs" data-load="runs.html"></section>
                    <section id="run-new" data-load="run-new.html"></section>
                    <section id="run-detail" data-load="run-detail.html"></section>
                    <section id="conversions" data-load="conversions.html"></section>
                    <section id="conversion-new" data-load="conversion-new.html"></section>
                    <section id="conversion-detail" data-load="conversion-detail.html"></section>
                    <section id="maintenance" data-load="maintenance.html"></section>
                    <section id="maintenance-new" data-load="maintenance-new.html"></section>
                    <section id="maintenance-detail" data-load="maintenance-detail.html"></section>
                    <section id="machines" data-load="machines.html"></section>
                    <section id="machine-setup" data-load="machine-setup.html"></section>
                    <section id="products" data-load="products.html"></section>
                    <section id="materials" data-load="materials.html"></section>
                    <section id="recipes" data-load="recipes.html"></section>
                    <section id="recipe-setup" data-load="recipe-setup.html"></section>
                    <section id="users" data-load="users.html"></section>
                    <section id="profile" data-load="profile.html"></section>
                    <section id="not-found" data-load="not-found.html"></section>
                    <section id="dashboard" data-load="dashboard.html"></section>
                </main>
            </div>
        </div>
        <script src="assets/lib/jquery/jquery.min.js"></script>
        <script src="assets/lib/spapp/jquery.spapp.js"></script>
        <script src="assets/lib/bootstrap/bootstrap.bundle.min.js"></script>
        <script src="assets/lib/sb-admin/scripts.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
