<div class="container-fluid px-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-4 mb-4">
        <h1 class="mb-0">Recipes</h1>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#recipeModal" data-modal-title="Add recipe">
            <i class="fa-solid fa-circle-plus me-1"></i>Add recipe
        </button>
    </div>

    <!-- Sample rows until the API is connected. -->
    <div class="card mb-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th scope="col" class="ps-3">Name</th>
                        <th scope="col" class="d-none d-sm-table-cell text-end">Materials</th>
                        <th scope="col" class="d-none d-md-table-cell">Status</th>
                        <th scope="col" class="text-end pe-3">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="ps-3">Clear film</td>
                        <td class="d-none d-sm-table-cell text-end">2</td>
                        <td class="d-none d-md-table-cell"><span class="badge text-bg-success">Active</span></td>
                        <td class="text-end pe-3 text-nowrap">
                            <a class="btn btn-sm btn-outline-primary" href="#recipe-setup?id=1"><i class="fa-solid fa-sliders"></i><span class="d-none d-lg-inline ms-1">Setup</span></a>
                            <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#recipeModal" data-modal-title="Edit recipe" aria-label="Edit"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                    <tr>
                        <td class="ps-3">White film</td>
                        <td class="d-none d-sm-table-cell text-end">3</td>
                        <td class="d-none d-md-table-cell"><span class="badge text-bg-success">Active</span></td>
                        <td class="text-end pe-3 text-nowrap">
                            <a class="btn btn-sm btn-outline-primary" href="#recipe-setup?id=2"><i class="fa-solid fa-sliders"></i><span class="d-none d-lg-inline ms-1">Setup</span></a>
                            <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#recipeModal" data-modal-title="Edit recipe" aria-label="Edit"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                    <tr>
                        <td class="ps-3">Black waste-bag film</td>
                        <td class="d-none d-sm-table-cell text-end">3</td>
                        <td class="d-none d-md-table-cell"><span class="badge text-bg-secondary">Inactive</span></td>
                        <td class="text-end pe-3 text-nowrap">
                            <a class="btn btn-sm btn-outline-primary" href="#recipe-setup?id=3"><i class="fa-solid fa-sliders"></i><span class="d-none d-lg-inline ms-1">Setup</span></a>
                            <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#recipeModal" data-modal-title="Edit recipe" aria-label="Edit"><i class="fa-solid fa-pen"></i></button>
                            <button type="button" class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="recipeModal" tabindex="-1" aria-labelledby="recipeModalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="recipeModalTitle">Add recipe</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">The materials and their shares are set on the recipe's Setup page.</p>
                    <div class="mb-3">
                        <label class="form-label" for="recipeName">Name</label>
                        <input class="form-control" id="recipeName" type="text" maxlength="100" required>
                        <div class="invalid-feedback">Enter the recipe's name.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="recipeNotes">Notes <span class="text-muted">(optional)</span></label>
                        <textarea class="form-control" id="recipeNotes" rows="2" maxlength="500"></textarea>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" id="recipeActive" type="checkbox" checked>
                        <label class="form-check-label" for="recipeActive">Active</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
