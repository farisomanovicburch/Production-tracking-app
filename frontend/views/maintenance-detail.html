<div class="container-fluid px-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-4 mb-4">
        <h1 class="mb-0">Maintenance details</h1>
        <a class="btn btn-outline-secondary" href="#maintenance"><i class="fa-solid fa-arrow-left me-1"></i>Maintenance log</a>
    </div>
    <div class="alert alert-warning d-none" data-record-missing>
        <i class="fa-solid fa-triangle-exclamation me-1"></i>This maintenance record does not exist.
        <a class="alert-link" href="#maintenance">Back to the maintenance log</a>
    </div>
    <!-- Sample record until the API is connected; every id shows the same one.
         The value attributes are the saved values that Cancel returns to. -->
    <div data-record-content>
        <div class="row">
            <div class="col-xl-8">
                <form class="card mb-4" id="maintenanceDetailForm" data-edit-form novalidate>
                    <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <span>Maintenance record #<span data-record-id></span> · logged by Demo Admin</span>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-primary" data-edit-start><i class="fa-solid fa-pen me-1"></i>Edit</button>
                            <button type="button" class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <fieldset class="card-body" data-editable disabled>
                        <legend class="visually-hidden">Maintenance values</legend>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label" for="maintenanceDetailMachine">Machine</label>
                                <select class="form-select" id="maintenanceDetailMachine" required>
                                    <option value="1">Extruder 1</option>
                                    <option value="2" selected>Extruder 2</option>
                                    <option value="3">Bag machine 1</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label" for="maintenanceDetailType">Type</label>
                                <select class="form-select" id="maintenanceDetailType" required>
                                    <option value="preventive">Preventive (planned)</option>
                                    <option value="corrective" selected>Corrective (a fault)</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label" for="maintenanceDetailStart">Started</label>
                                <input class="form-control" id="maintenanceDetailStart" type="datetime-local" value="2026-10-21T09:15" required>
                                <div class="invalid-feedback">Enter when the work started.</div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label" for="maintenanceDetailEnd">Finished</label>
                                <input class="form-control" id="maintenanceDetailEnd" type="datetime-local" value="2026-10-21T11:40" required data-not-before="#maintenanceDetailStart" data-order-message="The work cannot finish before it started.">
                                <div class="invalid-feedback">Not before the start.</div>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="maintenanceDetailDescription">Work done</label>
                                <textarea class="form-control" id="maintenanceDetailDescription" rows="3" maxlength="1000" required>Replaced a heater band on zone 3</textarea>
                                <div class="invalid-feedback">Describe the work.</div>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="maintenanceDetailNotes">Notes and spare parts</label>
                                <textarea class="form-control" id="maintenanceDetailNotes" rows="2" maxlength="1000">Used one spare 230 V heater band from stock.</textarea>
                            </div>
                        </div>
                    </fieldset>
                    <div class="card-footer d-flex justify-content-end gap-2 d-none" data-edit-actions>
                        <button type="button" class="btn btn-outline-secondary" data-edit-cancel>Cancel</button>
                        <button type="submit" class="btn btn-primary">Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
