<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
            <div class="text-center text-white mb-4">
                <i class="fa-solid fa-industry fa-2x mb-2"></i>
                <div class="fs-4 fw-semibold">Production Tracker</div>
            </div>
            <div class="card border-0 shadow-lg">
                <div class="card-body p-4">
                    <h1 class="h3 text-center mb-4">Log in</h1>
                    <form id="loginForm" novalidate>
                        <div class="form-floating mb-3">
                            <input class="form-control" id="loginEmail" type="email" placeholder="Email" autocomplete="email" required>
                            <label for="loginEmail">Email</label>
                            <div class="invalid-feedback">Enter a valid email address.</div>
                        </div>
                        <div class="form-floating mb-4">
                            <input class="form-control" id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" required>
                            <label for="loginPassword">Password</label>
                            <div class="invalid-feedback">Enter your password.</div>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Log in</button>
                    </form>
                </div>
                <div class="card-footer text-center small py-3">
                    No account yet? <a href="#register">Register</a>
                </div>
            </div>
        </div>
    </div>
</div>
